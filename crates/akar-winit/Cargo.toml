[package]
name = "akar-winit"
version = "0.1.0"
edition = "2021"

[dependencies]
akar-core = { path = "../akar-core" }
wgpu.workspace = true
winit.workspace = true
log.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSApplication", "NSResponder", "NSRunningApplication"] }
