[package]
name = "akar-core"
version = "0.1.0"
edition = "2021"

[features]
default = ["bundled-font"]
# Embeds IBM Plex Sans Regular + SemiBold (SIL OFL 1.1) into the binary so the
# default font database is populated and reproducible across machines. With this
# feature off, the caller must supply at least one font via TextPipelineConfig.
bundled-font = []
serde = ["dep:serde"]

[dependencies]
wgpu.workspace = true
glyphon.workspace = true
glam.workspace = true
thiserror.workspace = true
log.workspace = true
bytemuck.workspace = true
pollster = "0.4"
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1"
