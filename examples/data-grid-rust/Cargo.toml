[package]
name = "data-grid-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
akar-core = { path = "../../crates/akar-core", features = ["serde"] }
akar-layout = { path = "../../crates/akar-layout" }
akar-components = { path = "../../crates/akar-components" }
akar-winit = { path = "../../crates/akar-winit" }
taffy = { workspace = true }
glyphon = { workspace = true }
glam = { workspace = true }
wgpu = { workspace = true }
winit = { workspace = true }
pollster = "0.4"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fake = "5.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSApplication", "NSResponder", "NSRunningApplication", "NSWorkspace"] }
